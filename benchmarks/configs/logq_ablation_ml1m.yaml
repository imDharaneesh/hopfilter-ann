data:
    dataset: movielens-1m
    data_dir: data
    min_rating: 4.0
    validation_fraction: 0.1
    test_fraction: 0.1

tower:
    embedding_dim: 64
    hidden_dims: [128]
    output_dim: 64
    dropout: 0.0

trainer:
    epochs: 20
    batch_size: 1024
    learning_rate: 0.001
    weight_decay: 0.0

loss:
    temperature: 0.05
    frequency_learning_rate: 0.01

evaluation:
    ks: [10, 50, 100]
    head_fraction: 0.2
    validation_k: 50

seeds: [0, 1, 2]
results_path: benchmarks/results/logq_ablation_ml1m.json
