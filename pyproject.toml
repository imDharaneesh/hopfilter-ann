[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "hopfilter-ann"
dynamic = ["version"]
description = "Two-tower retrieval with a from-scratch HNSW index and filter-aware search."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Dharaneesh" }]
keywords = ["ann", "hnsw", "vector-search", "retrieval", "two-tower", "filtered-search"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/imDharaneesh/hopfilter-ann"
Issues = "https://github.com/imDharaneesh/hopfilter-ann/issues"

[project.scripts]
hopfilter = "hopfilter.cli:main"

[dependency-groups]
test = ["pytest>=8.3", "pytest-cov>=6.0", "hypothesis>=6.120"]
lint = [
    "ruff>=0.15",
    "mypy>=1.15",
    "clang-format==18.1.8",
    "pre-commit>=4.0",
    "clang-tidy==18.1.8",
]
docs = ["mkdocs-material>=9.6"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
default-groups = ["dev"]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cmake/**/*.cmake" },
    { file = "core/**/*" },
    { file = "bindings/**/*" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.24"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/hopfilter"]
sdist.exclude = ["data", "benchmarks/results", ".github"]

[tool.scikit-build.cmake.define]
HOPFILTER_BUILD_PYTHON = "ON"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(hopfilter VERSION (?P<value>[0-9.]+)'

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/python"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["slow: long-running tests excluded from wheel smoke tests"]

[tool.coverage.run]
source = ["hopfilter"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"
src = ["python", "tests/python"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PT", "PL", "D", "ANN", "ERA"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR2004"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "python"
packages = ["hopfilter"]
warn_unreachable = true
