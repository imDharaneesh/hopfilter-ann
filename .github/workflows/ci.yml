name: ci

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    UV_PYTHON_PREFERENCE: only-managed
    HOPFILTER_STRICT_FLAGS: -DHOPFILTER_WARNINGS_AS_ERRORS=ON -DHOPFILTER_BUILD_TESTS=ON

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.0
              with:
                  enable-cache: true
            - run: uv sync --locked --no-install-project --no-default-groups --group lint --all-extras
            - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

    clang-tidy:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.0
              with:
                  enable-cache: true
            - run: uv sync --locked --only-group lint
            - run: sudo apt-get update && sudo apt-get install -y ninja-build
            - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ $HOPFILTER_STRICT_FLAGS
            - run: cmake --build build
            - run: git ls-files 'core/src/*.cpp' 'tests/cpp/*.cpp' | xargs uv run --no-sync clang-tidy -p build

    python-tests:
        needs: lint
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python: ["3.13", "3.14"]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.3.0
              with:
                  enable-cache: true
                  python-version: ${{ matrix.python }}
            - run: uv sync --locked --no-group docs
            - run: uv run --no-sync pytest --cov=hopfilter --cov-report=xml
            - uses: actions/upload-artifact@v7
              if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
              with:
                  name: coverage
                  path: coverage.xml

    cpp-tests:
        needs: lint
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-latest, cxx: g++ }
                    - { os: ubuntu-latest, cxx: clang++ }
                    - { os: macos-latest, cxx: clang++ }
                    - { os: windows-latest, cxx: cl }
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7
            - if: matrix.cxx != 'cl'
              run: echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
            - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $HOPFILTER_STRICT_FLAGS
            - run: cmake --build build --config Release --parallel
            - run: ctest --test-dir build -C Release --output-on-failure

    sanitizers:
        needs: lint
        strategy:
            fail-fast: false
            matrix:
                sanitizer: [address, undefined, thread]
        runs-on: ubuntu-latest
        env:
            CXX: clang++
        steps:
            - uses: actions/checkout@v7
            - run: sudo apt-get update && sudo apt-get install -y ninja-build
            - if: matrix.sanitizer == 'thread'
              run: sudo sysctl vm.mmap_rnd_bits=28
            - run: >
                  cmake -S . -B build -G Ninja
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo
                  -DHOPFILTER_SANITIZER=${{ matrix.sanitizer }}
                  $HOPFILTER_STRICT_FLAGS
            - run: cmake --build build
            - run: ctest --test-dir build --output-on-failure

    docker:
        needs: [python-tests, cpp-tests]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  target: dev
                  push: false
                  load: true
                  tags: hopfilter-dev
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - run: docker run --rm hopfilter-dev
